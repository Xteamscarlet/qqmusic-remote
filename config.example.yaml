# QQ 音乐遥控配置模板
# 复制本文件为 config.yaml 后按本机实际情况修改（config.yaml 不会提交到 Git）

qqmusic:
  # QQ 音乐主程序路径（本机注册表实测：E:\QQMusic\QQMusic.exe）
  exe_path: "E:\\QQMusic\\QQMusic.exe"
  # 进程名（不含 .exe）
  process_name: "QQMusic"
  # 启动后等待窗口出现的最长秒数
  start_timeout: 20

# 全局快捷键兜底通道（需在 QQ音乐 设置 -> 快捷键 中确认已开启并与此处一致）
hotkeys:
  play_pause: ["ctrl", "alt", "f5"]
  next: ["ctrl", "alt", "right"]
  prev: ["ctrl", "alt", "left"]
  volume_up: ["ctrl", "alt", "up"]
  volume_down: ["ctrl", "alt", "down"]

# UI 自动化坐标校准值（由 calibrate 命令写入）
# 格式为 {win: [dx, dy], abs: [x, y]}：win 是相对完整模式主窗口左上角的偏移，
# 点击时按窗口当前位置实时换算——移动/还原窗口无需重新校准，仅界面布局变化才需要。
# 屏幕缩放（DPI 缩放比例，如 1.25 / 1.5）
screen_scale: 1.0
coords:
  search_box: null        # 主界面搜索框中心
  search_first_result: null  # 搜索结果第一首歌曲的播放按钮
  playlist_tab: null      # 搜索结果页"歌单"标签
  playlist_first: null    # 歌单结果第一项
  playlist_play_all: null # 歌单详情页"播放全部"按钮
  play_mode_button: null  # 底栏播放模式按钮

# 默认歌单名（指令"播放歌单"不带名字时使用）
default_playlist: "新新歌单"
